<!-- Hand-made fixture, based on the field list in docs/plans/04-browser-extension.md (trellis.ph). Labels are not bound; name and placeholder carry the meaning. -->
<main>
  <form id="apply">
    <div><span>Name</span><input name="firstName" placeholder="First name" required /></div>
    <div><input name="lastName" placeholder="Last name" required /></div>
    <div><input name="email" type="email" placeholder="Email address" required /></div>
    <div>
      <select name="phoneCode"><option value="63">+63</option><option value="1">+1</option></select>
      <input name="phoneNumber" placeholder="Mobile number" required />
    </div>
    <div class="ja-links">
      <div class="ja-link-row">
        <select name="linkType"><option>LinkedIn</option><option>Github</option><option>Portfolio</option><option>Google Drive</option><option>Other</option></select>
        <input name="linkName" type="text" placeholder="Ex. Twitter" style="display:none" />
        <input name="linkUrl" type="url" placeholder="https://" />
      </div>
      <button type="button">Add Link</button>
    </div>
    <button type="submit">Submit application</button>
  </form>
  <footer>
    <input name="newsletter" type="email" placeholder="Your email" required />
    <button type="button">Subscribe</button>
  </footer>
</main>
