<!-- Synthetic fixture: one form split into sections. The name block is in the first section, the links are in a later one. A newsletter form sits outside. -->
<main>
  <form id="application-form">
    <div class="section"><ul>
      <li><label>First name <input name="first_name" required /></label></li>
      <li><label>Last name <input name="last_name" required /></label></li>
      <li><label>Email <input name="email" required /></label></li>
    </ul></div>
    <div class="section"><ul>
      <li><label>LinkedIn Profile <input name="q_linkedin" /></label></li>
      <li><label>GitHub URL <input name="q_github" /></label></li>
      <li><label>Are you subject to any employment agreements or restrictions with your current employer or a past employer? <input name="q_employer" /></label></li>
      <li><label>Are you currently based within 50 miles of the job location, or able to relocate there before your start date? <input name="q_commute" /></label></li>
      <li><label>Search by country/region or code <input name="q_search" /></label></li>
      <li><label>Are you authorized to work in the country for which you applied? <input name="q_auth" /></label></li>
      <li><label>Will you require visa sponsorship to remain in your current location? <input name="q_visa" /></label></li>
    </ul></div>
  </form>
  <form id="news"><label>Email <input name="newsletter" /></label></form>
</main>
