<!-- Hand-made fixture, based on the field list in docs/plans/04-browser-extension.md (Teamtailor). Not a copy of a site page. -->
<main>
  <div id="employee-box">
    <label for="full_email">Email address without domain</label>
    <input id="full_email" name="full_email" type="text" />
  </div>
  <form id="apply">
    <div><label for="first_name">First name *</label><input id="first_name" name="candidate[first_name]" autocomplete="given-name" required /></div>
    <div><label for="last_name">Last name *</label><input id="last_name" name="candidate[last_name]" autocomplete="family-name" required /></div>
    <div><label for="email">Email *</label><input id="email" name="candidate[email]" type="email" autocomplete="email" required /></div>
    <div class="iti">
      <label for="phone">Phone</label>
      <input id="phone" name="candidate[phone]" type="tel" autocomplete="tel" />
      <div class="iti__dropdown-content">
        <input id="country_search" type="search" class="iti__search-input" />
        <input id="country_search_tel" type="tel" style="display:none" />
      </div>
    </div>
    <div><label for="q_salary">What are your salary expectations?</label><input id="q_salary" name="answers[1]" /></div>
    <div><label for="q_notice">What is your notice period?</label><input id="q_notice" name="answers[2]" /></div>
    <fieldset><legend>Are you allowed to work in the EU? *</legend>
      <label><input type="radio" name="answers[3]" id="eu_yes" value="yes" required /> Yes</label>
      <label><input type="radio" name="answers[3]" id="eu_no" value="no" /> No</label>
    </fieldset>
    <label><input type="checkbox" id="consent" name="consent" required /> I agree to the privacy policy *</label>
    <div><label for="cv">Upload CV</label><input id="cv" type="file" /></div>
    <div><label for="extra">Additional files</label><input id="extra" type="file" /></div>
    <button type="submit">Apply</button>
  </form>
</main>
