<!-- Hand-made fixture, based on the field list in docs/plans/04-browser-extension.md (Greenhouse). -->
<main>
  <button type="button">Autofill my application</button>
  <form id="application">
    <div><label for="first_name">First Name *</label><input id="first_name" autocomplete="given-name" required /></div>
    <div><label for="last_name">Last Name *</label><input id="last_name" autocomplete="family-name" required /></div>
    <div><label for="email">Email *</label><input id="email" type="email" autocomplete="email" required /></div>
    <div><label for="phone">Phone</label><input id="phone" type="tel" /></div>
    <div><label for="country">Country *</label><input id="country" role="combobox" aria-haspopup="listbox" required /></div>
    <div><label for="candidate-location">Location (City) *</label><input id="candidate-location" role="combobox" aria-haspopup="listbox" required /></div>
    <div><label for="gender">Gender</label><input id="gender" role="combobox" aria-haspopup="listbox" /></div>
    <div><label for="race">Race</label><input id="race" role="combobox" aria-haspopup="listbox" /></div>
    <div><label for="veteran_status">Veteran Status</label><input id="veteran_status" role="combobox" aria-haspopup="listbox" /></div>
    <div><label for="disability_status">Disability Status</label><input id="disability_status" role="combobox" aria-haspopup="listbox" /></div>
    <textarea id="g-recaptcha-response" name="g-recaptcha-response" style="display:none"></textarea>
    <button type="submit">Submit application</button>
  </form>
</main>
