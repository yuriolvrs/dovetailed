# What this file is: Cloudflare's config for the Worker — its name, entry
# point, and non-secret config values (LLM base URL/model, allowed CORS
# origins) exposed to the code as environment variables.
# In plain terms: settings for the proxy server that forwards requests to
# the LLM provider.

name = "dovetailed-proxy"
main = "src/index.ts"
compatibility_date = "2025-06-01"

[vars]
# OpenAI-compatible base URL and model id for the initial provider (Groq
# free tier). Confirmed against https://console.groq.com/docs/openai and
# https://console.groq.com/docs/models at the time this was written --
# re-verify if the provider changes.
# Switched from llama-3.1-8b-instant to openai/gpt-oss-120b: the 8B Llama
# model was frequently failing to produce parseable JSON (see PROGRESS.md's
# repeated "small-model noise" findings); GPT-OSS is trained specifically
# for reliable instruction/structured-output following. Free tier: 1K
# requests/day, 200K tokens/day (vs. the 8B model's 14.4K/day, 500K/day) --
# still generous for single-user use.
LLM_BASE_URL = "https://api.groq.com/openai/v1"
LLM_MODEL = "openai/gpt-oss-120b"
# Comma-separated list of origins allowed to call this proxy. Add the
# deployed Cloudflare Pages origin here once the frontend is deployed.
ALLOWED_ORIGINS = "http://localhost:5173,http://localhost:5174,https://dovetailed.pages.dev,https://pimp-my-resume.pages.dev"

# Document reader (OCR) used by /extract to turn an attached PDF/DOCX/PPTX or
# image into text. A separate provider from the text model above because Groq
# has no vision or document model. Endpoint and model confirmed against
# https://docs.mistral.ai/capabilities/OCR/basic_ocr/ at the time this was
# written -- re-verify if the provider changes. Files are sent inline as
# base64 data URIs, never via a provider upload/file API, so nothing is
# stored provider-side (PRD §10).
OCR_BASE_URL = "https://api.mistral.ai/v1"
OCR_MODEL = "mistral-ocr-latest"

# LLM_API_KEY and MISTRAL_API_KEY are secrets, not vars -- never put them here.
# Production: `wrangler secret put LLM_API_KEY` / `wrangler secret put MISTRAL_API_KEY`
# Local dev:  create worker/.dev.vars (gitignored) with LLM_API_KEY=... and
#             MISTRAL_API_KEY=...
