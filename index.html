<!doctype html>
<!--
  What this file is: the single HTML page that hosts the React app; Vite
  injects the built JS/CSS here.
  In plain terms: the one web page everything else gets loaded into.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=a2cdcd42" />
    <title>Pimp My Resume</title>
    <!-- Applies the saved theme (or OS preference) before first paint, so the
         page never flashes light and then switches to dark a moment later.
         Mirrors src/lib/theme.ts's storage key -- kept in sync by hand since
         this must run before any module script loads. -->
    <script>
      (function () {
        var stored = localStorage.getItem('theme');
        var dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
